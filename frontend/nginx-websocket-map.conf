# Mapeo estándar para el header Connection en proxys de WebSocket: si el
# cliente pide upgrade (WebSocket), reenviamos "upgrade"; si no, "close".
# Sin este mapeo, fijar el header a la constante "upgrade" (como hacía antes
# default.conf) deja la conexión en un estado ambiguo para nginx cuando la
# convierte en HTTP/1.1 keep-alive hacia el backend: el handshake (101
# Switching Protocols) se completa igual, pero los frames de datos que
# manda el cliente DESPUÉS del handshake (ej. el cursor en vivo del
# WebSocket de colaboración, que manda mensajes chicos y espaciados) no
# siempre se reenvían al backend de forma confiable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
