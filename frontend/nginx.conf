server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # El default de nginx (60s) corta antes de que /vision/detect termine
        # sus reintentos contra Gemini (backoff + fallback de modelo puede
        # tardar bastante mas de un minuto en el peor caso): 100s da margen
        # por debajo del timeout de 90s que ya tiene el cliente Axios, asi
        # nginx no interrumpe una respuesta que el backend esta por mandar.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
